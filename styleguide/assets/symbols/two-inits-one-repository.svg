  <text class="small" x="40" y="146">init --site ./styleguide</text>
  <text class="small" x="40" y="166">pages, config: packages</text>
  <text class="small" x="40" y="186">pd build: site/</text>
  <rect class="line" x="24.5" y="240.5" width="300" height="104"/>
  <text class="label" x="40" y="266">styleguide/</text>
  <text class="small" x="40" y="290">init --with-site</text>
  <text class="small" x="40" y="310">patterns, styles, themes, skin</text>
  <text class="small" x="40" y="330">pd build: dist/</text>
  <path class="hair" d="M174 200V232"/>
  <path class="solid" d="M174 240l-5 -10h10z"/>
  <text class="small" x="184" y="224">file:../styleguide</text>
  <path class="link" d="M324 186H560"/>
  <path class="head" d="M568 186l-10 -5v10z"/>
