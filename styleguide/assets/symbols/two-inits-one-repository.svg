  <path class="link" d="M324 330H480L513 208H560"/>
  <path class="head" d="M568 208l-10 -5v10z"/>
  <text class="small" x="402" y="322" text-anchor="middle">styleguide/dist</text>
  <rect class="line" x="568.5" y="140.5" width="140" height="84"/>
  <text class="label" x="584" y="166">_site/</text>
  <text class="small" x="584" y="190">/ the site</text>
  <text class="small" x="584" y="212">/workbench/</text>
  <rect class="line" x="24.5" y="376.5" width="380" height="36"/>
  <path class="line" d="M240 376V412M304 376V412"/>
  <text class="small" x="36" y="389">Title</text>
  <text class="title" x="36" y="406">Two inits, one repository</text>
